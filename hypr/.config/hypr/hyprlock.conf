background {
	monitor =
    path = ~/Pictures/Wallpapers/dark_snowy_mountain.png
	color = rgba(25, 20, 20, 1.0)
}

label {
    monitor =
    text = Welcome back, Conor
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Noto Sans

    position = 0, 300
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0.0) # no fill
    placeholder_text =
    fail_text = Wrong password

    outer_color = rgba(200, 200, 200, 1.0)
    check_color = 
    fail_color = 

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, 200
    halign = center
    valign = center
}
